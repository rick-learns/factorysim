[package]
name = "factory-sim"
description = "Deterministic discrete-event simulator for software factories"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
rand_pcg = "0.10"
rand_core = "0.10"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
